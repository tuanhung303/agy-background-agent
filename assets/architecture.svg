<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">agy-background-agent Lite Mode Stop Verifier Architecture</title>
  <desc id="diagram-desc">A modern, high-precision architecture diagram showcasing the Lite Mode Stop Verifier control plane for Antigravity coding agents, featuring session forking, mutation gating, empirical proof validation, and closed-loop steering.</desc>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#2563EB" stroke-width="1.25"/>
    </marker>
    <marker id="arrow-zinc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#71717A" stroke-width="1.25"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#10B981" stroke-width="1.25"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#E11D48" stroke-width="1.25"/>
    </marker>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap');

      :root {
        --bg: #FAFAFA;
        --card: #FFFFFF;
        --ink: #18181B;
        --soft: #52525B;
        --muted: #71717A;
        --faint: #A1A1AA;
        --border: #E4E4E7;
        --line-subtle: #F4F4F5;
        --accent: #2563EB;
        --accent-soft: rgba(37, 99, 235, 0.05);
        --accent-border: #BFDBFE;
        --green: #10B981;
        --green-soft: #ECFDF5;
        --green-border: #A7F3D0;
        --coral: #E11D48;
        --coral-soft: #FFF1F2;
        --coral-border: #FECDD3;
        --amber: #D97706;
        --amber-soft: #FFFBEB;
      }

      text {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        fill: var(--ink);
        text-rendering: geometricPrecision;
      }
      .mono {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .kicker {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: var(--accent);
      }
      .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        fill: var(--ink);
      }
      .sub {
        font-size: 13px;
        font-weight: 400;
        fill: var(--muted);
      }
      .card-shell {
        fill: var(--card);
        stroke: var(--border);
        stroke-width: 1;
      }
      .card-focus {
        fill: var(--accent-soft);
        stroke: var(--accent-border);
        stroke-width: 1;
      }
      .card-success {
        fill: var(--green-soft);
        stroke: var(--green-border);
        stroke-width: 1;
      }
      .card-failure {
        fill: var(--coral-soft);
        stroke: var(--coral-border);
        stroke-width: 1;
      }
      .zone-header {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: var(--muted);
      }
      .item-title {
        font-size: 13px;
        font-weight: 700;
        fill: var(--ink);
      }
      .item-sub {
        font-size: 11.5px;
        font-weight: 400;
        fill: var(--soft);
        line-height: 1.4;
      }
      .tag-chip {
        fill: #FFFFFF;
        stroke: var(--border);
        stroke-width: 1;
      }
      .tag-text {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 9px;
        font-weight: 600;
        fill: var(--muted);
      }
      .edge-accent {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.25;
        stroke-dasharray: 5 4;
        animation: flow 1.6s linear infinite;
        marker-end: url(#arrow-accent);
      }
      .edge-green {
        fill: none;
        stroke: var(--green);
        stroke-width: 1.25;
        stroke-dasharray: 5 4;
        animation: flow 1.6s linear infinite;
        marker-end: url(#arrow-green);
      }
      .edge-coral {
        fill: none;
        stroke: var(--coral);
        stroke-width: 1.25;
        stroke-dasharray: 5 4;
        animation: flow 1.6s linear infinite;
        marker-end: url(#arrow-coral);
      }
      .edge-zinc {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.25;
        marker-end: url(#arrow-zinc);
      }

      @keyframes flow {
        from { stroke-dashoffset: 18; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="#FAFAFA"/>

  <!-- Top Safe Area Header -->
  <g transform="translate(48, 28)">
    <text x="0" y="14" class="kicker">ANTIGRAVITY BACKGROUND STOP VERIFIER · LITE MODE CONTROL PLANE</text>
    <text x="0" y="42" class="title">Hermetic Stop Gate &amp; Empirical Proof Verification Architecture</text>
    <text x="0" y="64" class="sub">Isolated SQLite session forking, zero-delay mutation gating, strict empirical proof assertion, and closed-loop steering.</text>

    <!-- Top Stats Badges -->
    <g transform="translate(860, 0)">
      <rect x="0" y="0" width="100" height="28" class="card-shell"/>
      <text x="10" y="18" class="mono" font-size="11" font-weight="700" fill="#10B981">954/954 PASS</text>

      <rect x="108" y="0" width="108" height="28" class="card-shell"/>
      <text x="118" y="18" class="mono" font-size="11" font-weight="700" fill="#2563EB">ZERO MCP DEPS</text>

      <rect x="224" y="0" width="100" height="28" class="card-shell"/>
      <text x="234" y="18" class="mono" font-size="11" font-weight="700" fill="#71717A">3-STRIKE SAFE</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="48" y1="108" x2="1232" y2="108" stroke="#E4E4E7" stroke-width="1"/>

  <!-- ==================== ZONE 1: RUNTIME & HOOK INGRESS ==================== -->
  <g transform="translate(48, 126)">
    <!-- Zone Boundary Frame -->
    <rect x="0" y="0" width="240" height="500" class="card-shell"/>
    <rect x="0" y="0" width="240" height="32" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
    <text x="14" y="21" class="zone-header">01 · INGRESS &amp; HOOK GATE</text>

    <!-- Step 1: AGY Worker Session -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="212" height="110" class="card-shell"/>
      <text x="12" y="22" class="item-title">Antigravity Runtime</text>
      <text x="12" y="42" class="item-sub">Worker agent executes turn steps,</text>
      <text x="12" y="58" class="item-sub">issues tool calls, and signals</text>
      <text x="12" y="74" class="item-sub">premature stop intention.</text>
      <rect x="12" y="86" width="94" height="16" class="tag-chip"/>
      <text x="18" y="98" class="tag-text">PARENT SESSION</text>
    </g>

    <!-- Step 2: session-sage.py Hook -->
    <g transform="translate(14, 172)">
      <rect x="0" y="0" width="212" height="130" class="card-focus"/>
      <text x="12" y="22" class="item-title">hooks/session-sage.py</text>
      <text x="12" y="42" class="item-sub">Stop hook interceptor.</text>
      <text x="12" y="58" class="item-sub">Directly dispatches Lite Mode</text>
      <text x="12" y="74" class="item-sub">stop verifier with conversation lock</text>
      <text x="12" y="90" class="item-sub">and recursion protection.</text>
      <rect x="12" y="102" width="102" height="16" class="tag-chip"/>
      <text x="18" y="114" class="tag-text">run_lite_stop_audit</text>
    </g>

    <!-- Step 3: Mutation Gating -->
    <g transform="translate(14, 318)">
      <rect x="0" y="0" width="212" height="166" class="card-shell"/>
      <text x="12" y="22" class="item-title">sage/lite/gating.py</text>
      <text x="12" y="42" class="item-sub">Turn provenance extractor.</text>
      <text x="12" y="58" class="item-sub">• Scans file mutation tools</text>
      <text x="12" y="74" class="item-sub">• Inspects bash execs &amp; images</text>
      <text x="12" y="90" class="item-sub">• Fast-path 0-mutation bypass</text>
      <text x="12" y="106" class="item-sub">(Q&amp;A turns exit in &lt;10ms).</text>
      <rect x="12" y="120" width="118" height="16" class="tag-chip"/>
      <text x="18" y="132" class="tag-text">PROVENANCE GATING</text>
    </g>
  </g>

  <!-- ==================== ZONE 2: ISOLATED VERIFICATION ENGINE ==================== -->
  <g transform="translate(312, 126)">
    <!-- Zone Boundary Frame -->
    <rect x="0" y="0" width="540" height="500" class="card-shell"/>
    <rect x="0" y="0" width="540" height="32" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
    <text x="16" y="21" class="zone-header">02 · HERMETIC AUDIT CONTROL PLANE (ZERO MCP OVERHEAD)</text>

    <!-- Box 1: Session Forking & Isolation -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="508" height="110" class="card-shell"/>
      <text x="16" y="24" class="item-title">sage/lite/fork.py &amp; sage/executor.py</text>
      <text x="16" y="46" class="item-sub">Clones SQLite conversation DB and brain logs into isolated environment:</text>
      <text x="16" y="64" class="mono" font-size="11" fill="#2563EB">~/.gemini/antigravity-cli/sage_isolated_home</text>
      <text x="16" y="86" class="item-sub">Guarantees zero mutation to parent session state, auth tokens, or hooks.json.</text>
      <rect x="400" y="12" width="94" height="18" class="tag-chip"/>
      <text x="408" y="25" class="tag-text">SANDBOX ISOLATED</text>
    </g>

    <!-- Box 2: Quality Gate Verifier & Fast Model Cascade -->
    <g transform="translate(16, 172)">
      <rect x="0" y="0" width="508" height="144" class="card-focus"/>
      <text x="16" y="24" class="item-title">sage/lite/verifier.py &amp; sage/lite/prompt.py</text>
      <text x="16" y="46" class="item-sub">Runs fast-thinking Gemini model cascade on the forked session:</text>
      <text x="16" y="66" class="mono" font-size="11" fill="#18181B">Gemini 3.7 Flash (Low) → Flash (Medium) → Flash (High)</text>
      <text x="16" y="88" class="item-sub">• Evaluates verbatim user Definition of Done (DoD)</text>
      <text x="16" y="106" class="item-sub">• Extracts structured JSON LiteVerdict: {"verdict": "PASS"|"FAIL", "action": "..."}</text>
      <rect x="390" y="12" width="104" height="18" class="tag-chip"/>
      <text x="398" y="25" class="tag-text">FAST CASCADE</text>
    </g>

    <!-- Box 3: Empirical Proof Validator -->
    <g transform="translate(16, 332)">
      <rect x="0" y="0" width="508" height="152" class="card-shell"/>
      <text x="16" y="24" class="item-title">sage/lite/proof_validator.py</text>
      <text x="16" y="46" class="item-sub">Strict proof validation doctrine against proxy hallucination:</text>
      <text x="16" y="66" class="item-sub">• Rejects ungrounded self-report claims ("all tests pass", "tested locally")</text>
      <text x="16" y="84" class="item-sub">• Validates executed test commands, CLI returncodes, DOM state, or screenshot assets</text>
      <text x="16" y="102" class="item-sub">• Overrides unverified PASS to FAIL with domain-specific rejection requirements</text>
      <rect x="380" y="12" width="114" height="18" class="tag-chip"/>
      <text x="388" y="25" class="tag-text">PROOF DOCTRINE</text>
    </g>
  </g>

  <!-- ==================== ZONE 3: VERDICT & CLOSED-LOOP STEERING ==================== -->
  <g transform="translate(876, 126)">
    <!-- Zone Boundary Frame -->
    <rect x="0" y="0" width="356" height="500" class="card-shell"/>
    <rect x="0" y="0" width="356" height="32" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
    <text x="16" y="21" class="zone-header">03 · VERDICT &amp; CLOSED-LOOP ACTIONS</text>

    <!-- Verdict Branch A: PASS -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="324" height="140" class="card-success"/>
      <text x="14" y="24" class="item-title" fill="#10B981">PASS · Verified Clean Stop</text>
      <text x="14" y="46" class="item-sub">Empirical proofs confirmed valid.</text>
      <text x="14" y="64" class="item-sub">• Emits {"decision": "stop"} to runtime</text>
      <text x="14" y="82" class="item-sub">• Optional Knowledge Base Maintainer</text>
      <text x="14" y="100" class="item-sub">persists reusable skills to memory.</text>
      <rect x="14" y="112" width="120" height="18" class="tag-chip"/>
      <text x="22" y="125" class="tag-text">KNOWLEDGE WRITEBACK</text>
    </g>

    <!-- Verdict Branch B: FAIL -->
    <g transform="translate(16, 202)">
      <rect x="0" y="0" width="324" height="170" class="card-failure"/>
      <text x="14" y="24" class="item-title" fill="#E11D48">FAIL · Contextual Auto-Continue</text>
      <text x="14" y="46" class="item-sub">Quality gate violated or proof missing.</text>
      <text x="14" y="64" class="item-sub">• Generates domain-specific action directives</text>
      <text x="14" y="80" class="item-sub">(e.g. add test in scripts/verify/&lt;topic&gt;/)</text>
      <text x="14" y="98" class="item-sub">• Emits {"injectSteps": [...]}</text>
      <text x="14" y="116" class="item-sub">• 3-Strike Circuit Breaker prevents loops</text>
      <rect x="14" y="136" width="136" height="18" class="tag-chip"/>
      <text x="22" y="149" class="tag-text">CONTEXTUAL DIRECTIVE</text>
    </g>

    <!-- Telemetry Box -->
    <g transform="translate(16, 388)">
      <rect x="0" y="0" width="324" height="96" class="card-shell"/>
      <text x="14" y="22" class="item-title">Audit Log &amp; Session State</text>
      <text x="14" y="42" class="item-sub">Structured event journal rotated at 2MB:</text>
      <text x="14" y="60" class="mono" font-size="10" fill="#52525B">/tmp/agy_sage_events.jsonl</text>
      <text x="14" y="78" class="item-sub">Syncs strike count and statusline telemetry.</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTOR EDGES ==================== -->
  <!-- Edge 1: AGY Worker -> Hook -->
  <path d="M 168 282 L 168 298" class="edge-zinc"/>

  <!-- Edge 2: Hook -> Gating -->
  <path d="M 168 428 L 168 444" class="edge-zinc"/>

  <!-- Edge 3: Gating -> Session Forking (Zone 1 to Zone 2) -->
  <path d="M 274 526 L 293 526 L 293 227 L 312 227" class="edge-accent"/>

  <!-- Edge 4: Forking -> Quality Verifier -->
  <path d="M 582 282 L 582 298" class="edge-accent"/>

  <!-- Edge 5: Quality Verifier -> Proof Validator -->
  <path d="M 582 442 L 582 458" class="edge-accent"/>

  <!-- Edge 6: Proof Validator -> PASS Verdict (Zone 2 to Zone 3 Top) -->
  <path d="M 836 490 L 856 490 L 856 242 L 876 242" class="edge-green"/>

  <!-- Edge 7: Proof Validator -> FAIL Verdict (Zone 2 to Zone 3 Mid) -->
  <path d="M 836 510 L 876 510 L 876 413" class="edge-coral"/>

  <!-- Edge 8: FAIL Loop back to Ingress (Zone 3 to Zone 1) -->
  <path d="M 1038 498 L 1038 644 L 168 644 L 168 626" class="edge-coral"/>

  <!-- Bottom Footer Line -->
  <line x1="48" y1="680" x2="1232" y2="680" stroke="#E4E4E7" stroke-width="1"/>
  <text x="48" y="700" class="mono" font-size="10" fill="#71717A">AGY-BACKGROUND-AGENT · VERIFIED ARCHITECTURE · ZERO OVERHEAD LITE MODE</text>
  <text x="1100" y="700" class="mono" font-size="10" fill="#71717A">100% HERMETIC</text>
</svg>
