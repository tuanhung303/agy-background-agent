<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="bench-title bench-desc">
  <title id="bench-title">DeepSWE Benchmark: Sage ON vs Sage OFF</title>
  <desc id="bench-desc">Benchmark results on the kysely-window-grouping-helpers task comparing Sage ON and Sage OFF runs across turns, test pass rates, and reward status.</desc>
  
  <style>
    :root {
      --bg: #FAFBF8;
      --ink: #211F1C;
      --soft: #5B564E;
      --muted: #756F66;
      --line: #E8E6E0;
      --line-faint: #F0EFEA;
      --layer: #FFFFFF;
      --accent: #4185F4;
      --accent-ink: #1D4ED8;
      --accent-bg: #EEF4FE;
      --accent-border: #DBEAFE;
      --grey-bar: #A39D92;
      --grey-bg: #F2F1ED;
      --grey-border: #DCD8D0;
      --green: #15803D;
      --green-bg: #F0FDF4;
      --green-border: #BBF7D0;
      --risk: #E07A5F;
      --risk-ink: #C2410C;
      --risk-bg: #FFF1EE;
      --risk-border: #FED7AA;
    }
    text { fill: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-rendering: geometricPrecision; }
    .display { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 400; letter-spacing: -0.2px; }
    .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; fill: var(--muted); }
    .task-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; fill: var(--accent-ink); }
    .subtitle { font-size: 13px; fill: var(--soft); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; fill: var(--muted); }
    .stat-val { font-size: 22px; font-weight: 600; fill: var(--accent-ink); }
    .col-header { font-size: 10.5px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; fill: var(--muted); }
    .run-id { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .note-text { font-size: 11px; fill: var(--muted); }
    .footnote { font-size: 11px; fill: var(--muted); }
  </style>

  <!-- Canvas background -->
  <rect width="1200" height="580" fill="#FAFBF8"/>

  <!-- Outer frame -->
  <rect x="24" y="24" width="1152" height="532" fill="#FFFFFF" stroke="#E8E6E0" stroke-width="1"/>

  <!-- Top Header Zone -->
  <g transform="translate(48, 54)">
    <text x="0" y="0" class="kicker">01 // BENCHMARK EVALUATION</text>
    <text x="0" y="28" class="display">Sage ON vs OFF on Long-Horizon Tasks</text>
    <text x="0" y="52" class="subtitle">Task: <tspan class="task-tag">kysely-window-grouping-helpers</tspan> | 254 fail-to-pass + 22 pass-to-pass tests | Worker: Gemini 3.7 Flash</text>
  </g>

  <!-- Top Stat Cards (3 borderless cards on warm layer) -->
  <g transform="translate(730, 44)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="130" height="64" fill="#EEF4FE"/>
    <text x="14" y="22" class="stat-label">F2P PASS</text>
    <text x="14" y="48" class="stat-val mono">254/254</text>

    <!-- Card 2 -->
    <rect x="144" y="0" width="130" height="64" fill="#EEF4FE"/>
    <text x="158" y="22" class="stat-label">P2P KEEP</text>
    <text x="158" y="48" class="stat-val mono">100%</text>

    <!-- Card 3 -->
    <rect x="288" y="0" width="156" height="64" fill="#F2F1ED"/>
    <text x="302" y="22" class="stat-label">TURN BAND</text>
    <text x="302" y="48" class="stat-val mono" fill="#211F1C">141–201</text>
  </g>

  <!-- Section Divider Rule -->
  <line x1="48" y1="130" x2="1152" y2="130" stroke="#211F1C" stroke-width="1"/>

  <!-- Table Column Headers -->
  <g transform="translate(48, 150)">
    <text x="0" y="0" class="col-header">RUN &amp; SAGE STATE</text>
    <text x="210" y="0" class="col-header">TURNS TO COMPLETION (PLANNER STEPS)</text>
    <text x="690" y="0" class="col-header">F2P RATE</text>
    <text x="820" y="0" class="col-header">P2P RATE</text>
    <text x="940" y="0" class="col-header">REWARD</text>
    <text x="1030" y="0" class="col-header">OUTCOME</text>
  </g>

  <line x1="48" y1="160" x2="1152" y2="160" stroke="#E8E6E0" stroke-width="1"/>

  <!-- Data Rows (Zero Border Radius Everywhere) -->

  <!-- Row 1: arm3 (Sage OFF) -->
  <g transform="translate(48, 172)">
    <!-- Run Label & Pill -->
    <text x="0" y="26" class="run-id mono">arm3</text>
    <rect x="48" y="10" width="80" height="22" fill="#F2F1ED" stroke="#DCD8D0" stroke-width="1"/>
    <text x="56" y="25" class="mono" font-size="10.5" font-weight="600" fill="#5B564E">SAGE OFF</text>

    <!-- Turns Bar: 141 turns -->
    <rect x="210" y="12" width="420" height="18" fill="#F0EFEA"/>
    <rect x="210" y="12" width="269" height="18" fill="#A39D92"/>
    <text x="490" y="26" class="mono" font-size="12" font-weight="600" fill="#211F1C">141 turns</text>

    <!-- F2P -->
    <text x="690" y="26" class="mono" font-size="12.5" fill="#211F1C">254/254</text>
    <text x="752" y="26" class="mono" font-size="11" fill="#756F66">(100%)</text>

    <!-- P2P -->
    <text x="820" y="26" class="mono" font-size="12.5" fill="#211F1C">22/22</text>

    <!-- Reward Pill -->
    <rect x="940" y="9" width="60" height="24" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="955" y="25" class="mono" font-size="12" font-weight="700" fill="#15803D">1.0</text>

    <!-- Outcome text -->
    <text x="1030" y="25" class="note-text" fill="#15803D">Full pass</text>
  </g>

  <line x1="48" y1="228" x2="1152" y2="228" stroke="#F0EFEA" stroke-width="1"/>

  <!-- Row 2: arm4 (Sage ON) -->
  <g transform="translate(48, 238)">
    <text x="0" y="26" class="run-id mono">arm4</text>
    <rect x="48" y="10" width="80" height="22" fill="#EEF4FE" stroke="#DBEAFE" stroke-width="1"/>
    <text x="60" y="25" class="mono" font-size="10.5" font-weight="600" fill="#1D4ED8">SAGE ON</text>

    <!-- Turns Bar: 142 turns -->
    <rect x="210" y="12" width="420" height="18" fill="#F0EFEA"/>
    <rect x="210" y="12" width="271" height="18" fill="#4185F4"/>
    <text x="492" y="26" class="mono" font-size="12" font-weight="600" fill="#211F1C">142 turns</text>

    <!-- F2P -->
    <text x="690" y="26" class="mono" font-size="12.5" fill="#C2410C">250/254</text>
    <text x="752" y="26" class="mono" font-size="11" fill="#C2410C">(98.4%)</text>

    <!-- P2P -->
    <text x="820" y="26" class="mono" font-size="12.5" fill="#211F1C">22/22</text>

    <!-- Reward Pill -->
    <rect x="940" y="9" width="60" height="24" fill="#FFF1EE" stroke="#FED7AA" stroke-width="1"/>
    <text x="955" y="25" class="mono" font-size="12" font-weight="700" fill="#C2410C">0.0</text>

    <!-- Outcome text -->
    <text x="1030" y="20" class="note-text" fill="#C2410C">Stray space in SQL*</text>
    <text x="1030" y="34" class="note-text" font-size="9.5" fill="#756F66">4 dialect tests missed</text>
  </g>

  <line x1="48" y1="294" x2="1152" y2="294" stroke="#F0EFEA" stroke-width="1"/>

  <!-- Row 3: r2a (Sage OFF) -->
  <g transform="translate(48, 304)">
    <text x="0" y="26" class="run-id mono">r2a</text>
    <rect x="48" y="10" width="80" height="22" fill="#F2F1ED" stroke="#DCD8D0" stroke-width="1"/>
    <text x="56" y="25" class="mono" font-size="10.5" font-weight="600" fill="#5B564E">SAGE OFF</text>

    <!-- Turns Bar: 201 turns -->
    <rect x="210" y="12" width="420" height="18" fill="#F0EFEA"/>
    <rect x="210" y="12" width="384" height="18" fill="#A39D92"/>
    <text x="604" y="26" class="mono" font-size="12" font-weight="600" fill="#211F1C">201 turns</text>

    <!-- F2P -->
    <text x="690" y="26" class="mono" font-size="12.5" fill="#211F1C">254/254</text>
    <text x="752" y="26" class="mono" font-size="11" fill="#756F66">(100%)</text>

    <!-- P2P -->
    <text x="820" y="26" class="mono" font-size="12.5" fill="#211F1C">22/22</text>

    <!-- Reward Pill -->
    <rect x="940" y="9" width="60" height="24" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="955" y="25" class="mono" font-size="12" font-weight="700" fill="#15803D">1.0</text>

    <!-- Outcome text -->
    <text x="1030" y="25" class="note-text" fill="#15803D">Full pass</text>
  </g>

  <line x1="48" y1="360" x2="1152" y2="360" stroke="#F0EFEA" stroke-width="1"/>

  <!-- Row 4: r2b (Sage ON) -->
  <g transform="translate(48, 370)">
    <text x="0" y="26" class="run-id mono">r2b</text>
    <rect x="48" y="10" width="80" height="22" fill="#EEF4FE" stroke="#DBEAFE" stroke-width="1"/>
    <text x="60" y="25" class="mono" font-size="10.5" font-weight="600" fill="#1D4ED8">SAGE ON</text>

    <!-- Turns Bar: 165 turns -->
    <rect x="210" y="12" width="420" height="18" fill="#F0EFEA"/>
    <rect x="210" y="12" width="315" height="18" fill="#4185F4"/>
    <text x="536" y="26" class="mono" font-size="12" font-weight="600" fill="#211F1C">165 turns</text>

    <!-- F2P -->
    <text x="690" y="26" class="mono" font-size="12.5" fill="#211F1C">254/254</text>
    <text x="752" y="26" class="mono" font-size="11" fill="#756F66">(100%)</text>

    <!-- P2P -->
    <text x="820" y="26" class="mono" font-size="12.5" fill="#211F1C">22/22</text>

    <!-- Reward Pill -->
    <rect x="940" y="9" width="60" height="24" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="955" y="25" class="mono" font-size="12" font-weight="700" fill="#15803D">1.0</text>

    <!-- Outcome text -->
    <text x="1030" y="25" class="note-text" fill="#15803D">Full pass</text>
  </g>

  <line x1="48" y1="426" x2="1152" y2="426" stroke="#F0EFEA" stroke-width="1"/>

  <!-- Row 5: r2c (Sage ON v2) -->
  <g transform="translate(48, 436)">
    <text x="0" y="26" class="run-id mono">r2c</text>
    <rect x="48" y="10" width="138" height="22" fill="#EEF4FE" stroke="#DBEAFE" stroke-width="1"/>
    <text x="56" y="25" class="mono" font-size="10.5" font-weight="600" fill="#1D4ED8">SAGE ON (EXACT BRIEF)</text>

    <!-- Turns Bar: 154 turns -->
    <rect x="210" y="12" width="420" height="18" fill="#F0EFEA"/>
    <rect x="210" y="12" width="294" height="18" fill="#4185F4"/>
    <text x="515" y="26" class="mono" font-size="12" font-weight="600" fill="#211F1C">154 turns</text>

    <!-- F2P -->
    <text x="690" y="26" class="mono" font-size="12.5" fill="#211F1C">254/254</text>
    <text x="752" y="26" class="mono" font-size="11" fill="#756F66">(100%)</text>

    <!-- P2P -->
    <text x="820" y="26" class="mono" font-size="12.5" fill="#211F1C">22/22</text>

    <!-- Reward Pill -->
    <rect x="940" y="9" width="60" height="24" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="955" y="25" class="mono" font-size="12" font-weight="700" fill="#15803D">1.0</text>

    <!-- Outcome text -->
    <text x="1030" y="25" class="note-text" fill="#15803D">Full pass</text>
  </g>

  <!-- Bottom Scale & Gridline indicator -->
  <g transform="translate(258, 485)">
    <line x1="0" y1="0" x2="420" y2="0" stroke="#DCD8D0" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="4" stroke="#DCD8D0" stroke-width="1"/>
    <line x1="95.5" y1="0" x2="95.5" y2="4" stroke="#DCD8D0" stroke-width="1"/>
    <line x1="190.9" y1="0" x2="190.9" y2="4" stroke="#DCD8D0" stroke-width="1"/>
    <line x1="286.4" y1="0" x2="286.4" y2="4" stroke="#DCD8D0" stroke-width="1"/>
    <line x1="381.8" y1="0" x2="381.8" y2="4" stroke="#DCD8D0" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="4" stroke="#DCD8D0" stroke-width="1"/>
    
    <text x="0" y="14" class="mono" font-size="9.5" fill="#756F66" text-anchor="middle">0</text>
    <text x="95.5" y="14" class="mono" font-size="9.5" fill="#756F66" text-anchor="middle">50</text>
    <text x="190.9" y="14" class="mono" font-size="9.5" fill="#756F66" text-anchor="middle">100</text>
    <text x="286.4" y="14" class="mono" font-size="9.5" fill="#756F66" text-anchor="middle">150</text>
    <text x="381.8" y="14" class="mono" font-size="9.5" fill="#756F66" text-anchor="middle">200</text>
    <text x="420" y="14" class="mono" font-size="9.5" fill="#756F66" text-anchor="middle">220 turns</text>
  </g>

  <!-- Footnote / Legend Zone -->
  <line x1="48" y1="515" x2="1152" y2="515" stroke="#E8E6E0" stroke-width="1"/>
  
  <g transform="translate(48, 538)">
    <rect x="0" y="-8" width="10" height="10" fill="#A39D92"/>
    <text x="16" y="0" class="footnote">Sage OFF (Baseline)</text>
    
    <rect x="140" y="-8" width="10" height="10" fill="#4185F4"/>
    <text x="156" y="0" class="footnote">Sage ON</text>
    
    <text x="240" y="0" class="footnote">| Shared turn scale (0–220). Graded via official verifier frame (CTRF + test.patch). *arm4 missed binary reward due to a stray space in SQL emission.</text>
  </g>
</svg>
